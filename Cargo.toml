[workspace]
resolver = "2"
members = ["crates/agent", "crates/multitop", "crates/vault"]
exclude = ["fuzz"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
exit = "warn"

# `unsafe_code` is NOT a workspace lint. The agent and the vault are FFI by
# job (/proc, sysctl, openpty, flock, mlock) and the house refuses the
# per-module `#[expect(unsafe_code)]` that used to carve them out. The policy
# is structural instead: `multitop` denies it at its crate roots, and
# tools/check_unsafe_scope.py holds the set of files that may contain
# `unsafe` to an explicit list (a new module cannot add it silently, and a
# listed module that drops its last unsafe leaves the list).

[workspace.package]
version = "0.48.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The agent is uploaded to every monitored host on first connect, so it is
# tuned for size. Its work is a few hundred microseconds of /proc parsing;
# opt-level "s" costs nothing measurable and saves ~40% of the transfer.
[profile.release.package.multitop-agent]
opt-level = "z"
