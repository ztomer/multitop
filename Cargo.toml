[workspace]
resolver = "2"
members = ["crates/agent", "crates/multitop", "crates/vault"]
exclude = ["fuzz"]

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
exit = "warn"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.package]
version = "0.21.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The agent is uploaded to every monitored host on first connect, so it is
# tuned for size. Its work is a few hundred microseconds of /proc parsing;
# opt-level "s" costs nothing measurable and saves ~40% of the transfer.
[profile.release.package.multitop-agent]
opt-level = "z"
