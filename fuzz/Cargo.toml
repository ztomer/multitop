[package]
name = "multitop-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

# Its own workspace root, wherever the checkout sits. The root workspace's
# `exclude = ["fuzz"]` is not enough: cargo finds a workspace by walking up,
# and from a git worktree nested inside the main checkout the walk reached the
# MAIN checkout's Cargo.toml, so every cargo call here failed with "believes
# it's in a workspace when it's not" (tests/test_standalone_manifest_root.py).
[workspace]

[dependencies]
libfuzzer-sys = "0.4"
multitop-agent = { path = "../crates/agent" }
multitop = { path = "../crates/multitop" }

[[bin]]
name = "fuzz_proto"
path = "fuzz_targets/fuzz_proto.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_client_stream"
path = "fuzz_targets/fuzz_client_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_proc_stat"
path = "fuzz_targets/fuzz_proc_stat.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_meminfo"
path = "fuzz_targets/fuzz_meminfo.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_net_dev"
path = "fuzz_targets/fuzz_net_dev.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_fetch"
path = "fuzz_targets/fuzz_fetch.rs"
test = false
doc = false
bench = false
