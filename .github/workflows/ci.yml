name: CI

# Every gate the pre-commit hook runs, enforced where it cannot be bypassed
# with --no-verify. The two lists are checked against each other by
# `tools/check_gate_parity.py`, which runs in the first job below -- they had
# drifted before, and a CI list shorter than the local one is a merge gate that
# does less than the hook it is meant to backstop.
on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    name: fmt / clippy / structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # `keyring` reaches the Linux credential store through
      # `dbus-secret-service`, whose `libdbus-sys` needs the system library at
      # build time. Without this every cargo step here dies in a build script
      # before compiling a line of this project -- which is exactly what it did,
      # on every run, while the local gates were green.
      - uses: ./.github/actions/system-deps

      # Checks every tracked file, not just a diff: a gate that only looks at
      # what changed lets pre-existing violations sit forever.
      - name: Structural gates
        run: |
          python3 tools/check_gate_parity.py --self-test
          python3 tools/check_gate_parity.py
          python3 tools/check_no_emoji.py --self-test
          python3 tools/check_no_emoji.py
          python3 tools/check_test_only_code.py --self-test
          python3 tools/check_test_only_code.py
          python3 tools/check_key_hints.py --self-test
          python3 tools/check_key_hints.py
          python3 tools/check_keychain_isolation.py --self-test
          python3 tools/check_keychain_isolation.py
          python3 tools/check_row0_owner.py --self-test
          python3 tools/check_row0_owner.py
          python3 tools/check_magic_numbers.py --self-test
          python3 tools/check_magic_numbers.py

      - name: Formatting
        run: cargo fmt --all -- --check

      # --all-targets because tests and benches carry the same lint config as
      # src and are where warnings have accumulated before.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps

      # The SSH-backed tests are #[ignore]d and stay that way here: CI has no
      # reachable host. They are run manually against real machines -- see
      # DEVELOPMENT.md.
      - name: Test
        run: cargo test --workspace --all-features

      # The shared gate harness. `tools/coverage_check.sh` delegates its floor
      # and its exclusions to `$GOH/gates/coverage_gate.sh`, so without this the
      # coverage job dies with `No such file or directory` and exit 127 -- which
      # it had been doing on every push since the delegation landed. A merge
      # gate that cannot run is not a merge gate.
      - name: Check out the shared gate harness
        uses: actions/checkout@v4
        with:
          repository: ztomer/gates_of_heck
          path: .gates_of_heck

      - name: Line-count ratchet (tools/loc_baseline.txt)
        env:
          GOH_DIR: ${{ github.workspace }}/.gates_of_heck
        run: |
          python3 tools/ratchet_check.py --self-test
          python3 tools/ratchet_check.py

      - name: Install pytest
        # Without it the e2e step dies on `No module named pytest`, which is
        # what it did the first time it ran here.
        run: python3 -m pip install --quiet pytest

      - name: End-to-end suites (tests/test_exec_live.py, tests/test_tmux_e2e.py)
        # They drive the built binary, so build it first. Both skip with a
        # stated reason when what they need is absent -- the live suite without
        # reachable hosts, the tmux suite without tmux -- so neither turns a
        # runner's missing tool into a silent pass or a red build.
        run: |
          cargo build -p multitop
          python3 -m pytest tests/ -q

      - name: Benches build
        run: cargo bench --no-run

  coverage:
    name: coverage (95% floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps

      # The shared gate harness. `tools/coverage_check.sh` delegates its floor
      # and its exclusions to `$GOH/gates/coverage_gate.sh`, so without this the
      # coverage job dies with `No such file or directory` and exit 127 -- which
      # it had been doing on every push since the delegation landed. A merge
      # gate that cannot run is not a merge gate.
      - name: Check out the shared gate harness
        uses: actions/checkout@v4
        with:
          repository: ztomer/gates_of_heck
          path: .gates_of_heck

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov

      - name: Coverage (workspace, fail under 95%)
        env:
          GOH_DIR: ${{ github.workspace }}/.gates_of_heck
        run: |
          # The one definition of the floor and its exclusions lives in the
          # script. CI and the pre-commit hook both call it, so a local gate
          # cannot be weaker than the one that blocks the merge.
          bash tools/coverage_check.sh

      # `target/lcov.info`, which is where the script writes it. This said
      # `lcov.info` and matched nothing, so the artifact had been empty for as
      # long as it had existed.
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov-workspace
          path: target/lcov.info
          if-no-files-found: error

  fuzz:
    name: fuzz targets build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Nightly on purpose, and only here. rust-toolchain.toml pins the
      # workspace to stable because nightly ICEs on multitop-vault under
      # clippy; `cargo fuzz` is the one thing that genuinely needs nightly, and
      # it builds the fuzz crate rather than the workspace.
      - uses: dtolnay/rust-toolchain@nightly

      - uses: Swatinem/rust-cache@v2

      - uses: ./.github/actions/system-deps

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz

      # Building, not running: a fuzz run has no natural end. This catches the
      # failure that actually happens -- a target that stopped compiling
      # because what it fuzzes changed shape. `fuzz_proto` went non-exhaustive
      # when the protocol gained a variant and nothing caught it until a
      # release, because this gate lived only in scripts/local-ci.py.
      - name: Build every fuzz target (sanitizer on)
        run: |
          for t in fuzz/fuzz_targets/*.rs; do
            cargo +nightly fuzz build "$(basename "$t" .rs)"
          done
