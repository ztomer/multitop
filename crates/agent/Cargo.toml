[package]
name = "multitop-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compact system/docker monitor, uploaded to and run on monitored hosts"

[[bin]]
name = "multitop-agent"
path = "src/main.rs"

[lib]
name = "multitop_agent"
path = "src/lib.rs"

[dependencies]
libc = "0.2"
# The checked float -> integer conversions (`ToPrimitive`): std has no
# `TryFrom<f64>`, and `as` is the silent cast `conv` exists to replace.
num-traits = "0.2"
# Docker's /containers/json and /stats payloads are deeply nested; a hand-rolled
# parser here would be the fragile part of the agent. No derive feature - the
# few fields we read are pulled straight off Value.
serde_json = { version = "1", default-features = false, features = ["std"] }
# The terminal escape grammar, read ONE way. Three hand-rolled parsers each
# understood a different subset of it (one knew only `ESC[`, one dropped the
# ESC of `ESC 7` and printed the `7`), and apt's pinned progress bar tore the
# upgrade log apart in the gap between them. `escape.rs` wraps this state
# machine (the vt100.net DEC parser, as used by Alacritty) and every reader
# of tool output goes through it.
vte = "0.15"
# `multitop-agent mcp` is rmcp, the official Rust MCP SDK (owner ruling OW.60,
# queue MCP.MON): protocol upkeep -- versions, framing, the 2026-07-28
# stateless lifecycle -- is upstream's; this crate says only which tools exist,
# what each does to the machine, and how a call reaches it (src/mcp.rs).
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-io"] }
# rmcp is async and nothing else in the agent is: one current-thread runtime,
# built by `mcp::run` for the session, is the only place tokio runs.
tokio = { version = "1", default-features = false, features = ["rt", "io-std", "io-util"] }

# libc deprecated its Mach bindings (mach_host_self / mach_task_self) in favour
# of mach2; house rule: migrate on sight, never suppress the warning.
[target.'cfg(target_os = "macos")'.dependencies]
mach2 = "0.7"

[dev-dependencies]
tempfile = "3"
# One definition of the emptiness assertions, shared with the other two crates'
# tests. A dev-dependency, so it reaches `#[cfg(test)]` sites in `src/` too and
# links into no shipped binary -- see crates/testassert/src/lib.rs.
multitop-testassert = { path = "../testassert" }

# THE CRATE THAT ESCAPED. `[workspace.lints]` has declared `pedantic` all along,
# and `multitop` and `vault` both opted in — this one never did, so the biggest
# crate in the workspace inherited none of it and accumulated 254 findings that
# nothing reported. Opting in is what makes the workspace policy true rather
# than merely written down; the gate runs clippy at `-D warnings`, so this is a
# ratchet, not a suggestion.
[lints]
workspace = true
