[package]
name = "multitop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-server TUI dashboard over SSH"

[lints]
workspace = true

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
# Already in the tree as a dependency of crossterm's event-stream; a direct
# dependency is what lets the SIGUSR1/SIGUSR2 diagnostic dump use it.
signal-hook = "0.3"
keyring = { version = "4", default-features = true }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time", "signal"] }
tokio-stream = { version = "0.1.19", default-features = false }
libc = "0.2"
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
# Writes back without reformatting. `toml` reconstructs a file from its parsed
# value, which silently drops every comment and blank line the user wrote.
# Already in the tree as a dependency of `toml`, so this costs no new code.
toml_edit = "0.25"
zstd = "0.14"
multitop-agent = { path = "../agent" }
multitop-vault = { path = "../vault" }
secrecy = "0.10"
# P0.1: the `--serve` token. Both are already in the tree transitively; declaring them
# is what lets the token's SOURCE and its COMPARE be ours rather than something we
# reach through another crate's choice.
getrandom = "0.4"
subtle = "2.6"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["std"] }
axum = { version = "0.8", features = ["json"] }
# 0.5, and the reason this line ever mattered is in server_test.rs's
# `the_tower_this_crate_declares_drives_the_router_axum_builds`. Declared 0.4
# while axum 0.7 already resolved 0.5, so the tree carried two majors of one
# crate -- two copies of the same name that are not the same type, and the
# compiler reports that as an error naming the TYPE, never the pin.
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
# A2-TLS (docs/roadmap.md): a non-loopback `--serve` speaks TLS with a self-signed
# certificate the phone pins at pairing. `ring` rather than the default aws-lc-rs on
# all three: one crypto provider in the graph, and no cmake/NASM in the build. TLS 1.2
# stays on because the client's floor (minSdk 28, Android 9) predates TLS 1.3.
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "pem", "ring"] }
# The certificate's fingerprint and its payload form. Both already in the tree.
sha2 = "0.11"
base64 = "0.23"
# The pairing string as a terminal QR code; no image backend.
qrcode = { version = "0.14.1", default-features = false }

[[bench]]
name = "client_bench"
harness = false

[[bench]]
name = "remote_ssh_bench"
harness = false

[dev-dependencies]
tempfile = "3.27.0"
# The agent's loop test needs a clock it can move: `tokio::time::pause`, so
# the test can prove the agent waits its tick without waiting for it. A
# dev-dependency feature, so it reaches no shipped binary.
tokio = { version = "1", features = ["test-util"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
# One definition of the emptiness assertions, shared with the other two crates'
# tests. A dev-dependency, so it reaches `#[cfg(test)]` sites in `src/` too and
# links into no shipped binary -- see crates/testassert/src/lib.rs.
multitop-testassert = { path = "../testassert" }
vt100 = "0.18.1"
