[package]
name = "multitop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Multi-server TUI dashboard over SSH"

[lints]
workspace = true

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-stream = { version = "0.1.19", default-features = false }
toml = { version = "1", default-features = false, features = ["parse", "serde", "display"] }
zstd = "0.13"
multitop-agent = { path = "../agent" }
multitop-vault = { path = "../vault" }
secrecy = "0.10"

[[bench]]
name = "client_bench"
harness = false

[[bench]]
name = "remote_ssh_bench"
harness = false

[dev-dependencies]
tempfile = "3.27.0"
