[package]
name = "multitop-vault"
version = "0.21.0"
edition = "2021"
license = "MIT"
description = "Encrypted sudo password vault with biometric unlock"

[lints]
workspace = true

[dependencies]
# Crypto
#
# One RustCrypto generation for everything THIS CRATE declares. `sha2` was
# pinned 0.10 while `ed25519-dalek 3` already resolved 0.11, so the tree carried
# two generations of the same primitives and the house gate calls that pin
# FATAL -- our pin is why two majors are in the tree, and the compiler reports
# the consequence as an error naming the TYPE, never the pin.
#
# `hkdf` and `argon2` move in the same commit rather than their own because half
# of this does not compile alone: argon2 0.6 sits on the same `digest` 0.11
# line, so pinning sha2 without it, or it without sha2, is a lockfile that
# resolves and a tree that does not build.
#
# NOT the whole tree, and worth not pretending otherwise. `sha2 0.10.9` and
# `digest 0.10.7` are still in the lockfile, and the holder is neither of ours:
# `cargo tree --target all -i digest@0.10.7` names `secret-service 5.1.0`,
# reached through `keyring -> zbus-secret-service-keyring-store`. Transitive,
# Linux-only, and not movable from here. So this commit ends OUR half of the
# duplicate -- `goh.sh deps` reports no dependency pinned below the graph -- and
# the 0.10 generation survives in the tree until keyring moves.
aes-gcm = "0.11"
argon2 = "0.6"
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
hkdf = "0.13"
rand = { version = "0.10", features = ["std"] }
secrecy = "0.10"
sha2 = "0.11"
zeroize = { version = "1.8", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# System
dirs = "7.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
hex = "0.4"
fs2 = "0.4"
libc = "0.2"

# Keychain (unified on keyring 4 with multitop; one major per workspace)
keyring = { version = "4", default-features = true }

# Platform-specific
#[cfg(target_os = "macos")]
security-framework = "3.7"
security-framework-sys = "2.17"

#[cfg(target_os = "linux")]
# 5, and one manifest line: every call this crate makes through zbus --
# `Connection::system`, the four-argument `Proxy::new`, `call_method`,
# `Message::body().deserialize()`, and the
# `DeserializeOwned + zbus::zvariant::Type` bound on the reply helper --
# compiles against 5.19.0 unchanged. Verified by compiling the module's
# whole zbus surface in a scratch crate against 5.19.0 with this exact
# feature set, on 2026-10-05, rather than by reading a migration guide.
#
# It also drops a hash crate we did not choose: zbus 4 held `sha1`, and with
# it `rand 0.8` whose only parent in the tree was zbus 4. zbus 5.19 pulls in no
# hash crate at all. What survives of the 0.10 generation is `secret-service`'s,
# not ours -- see the sha2 note above.
#
# What is NOT verified here: the Linux BUILD of this crate. `fprintd.rs` is
# `#[cfg(target_os = "linux")]`, so no macOS gate compiles it, and the
# fingerprint DAEMON cannot be exercised without hardware. CI's ubuntu
# jobs are what check that this compiles for the platform that ships it.
zbus = { version = "5", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.10"
hex = "0.4"
# One definition of the emptiness assertions, shared with the other two crates'
# tests. Reachable from `src/mlock.rs`'s `#[cfg(test)]` module only because it
# is a dev-dependency rather than a `tests/` module -- see
# crates/testassert/src/lib.rs.
multitop-testassert = { path = "../testassert" }
# Sealing the vault key to this machine's TPM. Linux only: there is no
# tpm2-tss on macOS, which has the Secure Enclave instead.
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.7"

# cargo-machete scans for the crate's IDENT, so a dependency reached only
# through a STRING is invisible to it. `serde_bytes` is used exactly that way --
# `#[serde(with = "serde_bytes")]` on the fixed-size key and signature arrays,
# which is what makes them serialize as bytes rather than as 32- and 64-element
# sequences. Removing it changes the on-disk vault format.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]
