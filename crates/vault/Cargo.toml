[package]
name = "multitop-vault"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Encrypted sudo password vault with biometric unlock"

[dependencies]
# Crypto
aes-gcm = "0.10"
argon2 = "0.5"
ed25519-dalek = "2.1"
hkdf = "0.12"
rand = { version = "0.8", features = ["std"] }
secrecy = "0.10"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# System
dirs = "5.0"
thiserror = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
rpassword = "7.0"
hex = "0.4"
fs2 = "0.4"
libc = "0.2"

# Keychain
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }

# Platform-specific
#[cfg(target_os = "macos")]
security-framework = "3.7"
security-framework-sys = "2.17"

#[cfg(target_os = "linux")]
zbus = { version = "4", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.10"
hex = "0.4"