[package]
name = "multitop-vault"
version = "0.21.0"
edition = "2021"
license = "MIT"
description = "Encrypted sudo password vault with biometric unlock"

[lints]
workspace = true

[dependencies]
# Crypto
aes-gcm = "0.11"
argon2 = "0.5"
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
hkdf = "0.12"
rand = { version = "0.10", features = ["std"] }
secrecy = "0.10"
sha2 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_bytes = "0.11"

# System
dirs = "5.0"
thiserror = "2.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
hex = "0.4"
fs2 = "0.4"
libc = "0.2"

# Keychain
keyring = { version = "3", features = ["apple-native", "sync-secret-service"] }

# Platform-specific
#[cfg(target_os = "macos")]
security-framework = "3.7"
security-framework-sys = "2.17"

#[cfg(target_os = "linux")]
zbus = { version = "4", features = ["tokio"] }

[dev-dependencies]
tempfile = "3.10"
hex = "0.4"
# Sealing the vault key to this machine's TPM. Linux only: there is no
# tpm2-tss on macOS, which has the Secure Enclave instead.
[target.'cfg(target_os = "linux")'.dependencies]
tss-esapi = "7.7"

# cargo-machete scans for the crate's IDENT, so a dependency reached only
# through a STRING is invisible to it. `serde_bytes` is used exactly that way --
# `#[serde(with = "serde_bytes")]` on the fixed-size key and signature arrays,
# which is what makes them serialize as bytes rather than as 32- and 64-element
# sequences. Removing it changes the on-disk vault format.
[package.metadata.cargo-machete]
ignored = ["serde_bytes"]
