[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Gated whole via goh's gates/py_staged.sh --all (G17c): what the rule set still reports is held
# to a per-file ceiling in tools/py_lint_ceilings.json that can only fall (a file over its ceiling,
# a file with findings and no ceiling, or a ceiling above the truth is red). PLW1510 (G17b) is at 0.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DTZ", "S", "C4", "PIE", "ISC", "RUF", "PL", "FURB", "TRY", "BLE", "EXE"]

[tool.ruff.lint.per-file-ignores]
"checks/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]
"scripts/**/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]
"scripts/music/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# The suite runs under xdist (.gatesrc), whose workers are threaded: a fork() there may
# deadlock the child before exec, and CPython says so with this warning. It is an error,
# so a test that forks the worker goes red instead of hanging one push in a hundred.
filterwarnings = ["error:This process \\(pid=\\d+\\) is multi-threaded:DeprecationWarning"]
testpaths = ["tests", "checks/tests", "scripts/music/tests", "scripts/maintenance/tests", "lidarr/extended/tests", "sonarr/extended/tests", "radarr/extended/tests"]
