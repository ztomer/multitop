[tool.ruff]
line-length = 120

[tool.ruff.lint]
# NOT yet a gate as a whole (346 findings, 2026-10-26). What IS gated: PLW1510 (every
# subprocess.run says what a failing child does, goh G17b), run by name as
# `ruff check --select PLW1510 .` in GOH_CI_STEPS and in ci.yml.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DTZ", "S", "C4", "PIE", "ISC", "RUF", "PL", "FURB", "TRY", "BLE", "EXE"]

[tool.ruff.lint.per-file-ignores]
"checks/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]
"scripts/**/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]
"scripts/music/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "checks/tests", "scripts/music/tests", "scripts/maintenance/tests", "lidarr/extended/tests", "sonarr/extended/tests", "radarr/extended/tests"]
