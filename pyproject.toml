[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Gated whole via goh's gates/ruff_ratchet.py (G17c): what the rule set still reports is held to
# a per-rule count in ruff_ratchet.json that can only fall (a rule over its count, a rule with
# findings and no count, or a count above the truth is red). PLW1510 (G17b) is at 0.
select = ["E", "W", "F", "I", "UP", "B", "SIM", "DTZ", "S", "C4", "PIE", "ISC", "RUF", "PL", "FURB", "TRY", "BLE", "EXE"]

[tool.ruff.lint.per-file-ignores]
"checks/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]
"scripts/**/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]
"scripts/music/tests/*" = ["BLE001", "S101", "PLR2004", "UP031"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests", "checks/tests", "scripts/music/tests", "scripts/maintenance/tests", "lidarr/extended/tests", "sonarr/extended/tests", "radarr/extended/tests"]
