# Servers to monitor. Sudo passwords are NOT configured here: each server has
# its own, set in the Settings screen (`e`) and kept in the OS credential
# store and the encrypted vault. A `sudo_password` key in this file is not
# supported -- it is plaintext on disk, and if one is found at startup it is
# moved into the credential store and deleted from here.

[[servers]]
host = "192.168.0.33"
port = 22
user = ""
# upgrade_cmd = "sudo apt update && sudo apt upgrade -y"

# How the panel banner draws the host name. "wide" uses fullwidth Latin glyphs
# (U+FF01-FF5E), which Menlo, SF Mono, JetBrains Mono and Berkeley Mono do not
# have -- with one of those your terminal falls back to a CJK face and the
# banner is drawn in a different typeface from everything under it. multitop
# cannot see your font, so this is your call. Toggle with B in Settings.
# banner_style = "plain"
# Alert thresholds (0-100, optional). When a metric exceeds the threshold the
# panel header tints amber→red and `H` shows the last 30m sparkline of the
# breach. Same `METER_HIGH_PCT` constants the bars use.
# alert_cpu = 80
# alert_mem = 85
# alert_disk = 90
# The command runs as the SSH `user`, not as root, so prefix any privileged
# step with `sudo` -- apt and dpkg will refuse to run as a normal user.

[[servers]]
host = "192.168.0.90"
port = 22
user = ""
# upgrade_cmd = "sudo apt update && sudo apt upgrade -y"

